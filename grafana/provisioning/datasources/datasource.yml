apiVersion: 1

datasources:
  - name: Prometheus
    # FIXED uid SO THE PROVISIONED DASHBOARD JSON (grafana/dashboards/overview.json) CAN
    # REFERENCE THIS DATASOURCE BY A STABLE ID INSTEAD OF A NAME LOOKUP.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
