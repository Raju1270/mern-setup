worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # RE-RESOLVES "gateway" ON EVERY REQUEST (VIA THE $upstream VARIABLE BELOW), INSTEAD OF ONCE
    # AT NGINX STARTUP THE WAY A PLAIN `proxy_pass http://gateway:5003;` WOULD. REQUIRED FOR
    # ROUND-ROBINING ACROSS gateway'S SCALED REPLICAS — DOCKER COMPOSE GIVES THEM ALL THE SAME
    # DNS NAME ("gateway"), AND DOCKER'S EMBEDDED DNS (127.0.0.11) ROTATES WHICH REPLICA'S IP IT
    # HANDS BACK PER QUERY. A STATIC upstream {} BLOCK WOULD RESOLVE ONCE AND STICK TO ONE
    # REPLICA FOR NGINX'S ENTIRE LIFETIME, WHICH DEFEATS THE POINT.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # NGINX'S OWN PROBE, KEPT OFF /health SO IT DOESN'T SHADOW gateway'S REAL /health ROUTE
        # (WHICH REPORTS ITS OWN PROCESS STATUS) — THIS SEPARATE PATH IS ONLY FOR nginx's OWN
        # DOCKER HEALTHCHECK BELOW, NOT A CLIENT-FACING ENDPOINT.
        location /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-lb"}';
        }

        location / {
            set $upstream http://gateway:5003;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
